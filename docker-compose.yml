services:
  postgres:
    image: postgres:16-alpine
    container_name: mike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mikeDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mike-network
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # build: .
    image: softvence/mike-server:latest
    container_name: mike-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mike-network
    command: >
      sh -c " npx prisma migrate deploy && node dist/src/main.js "

volumes:
  postgres_data:

networks:
  mike-network:
    driver: bridge
